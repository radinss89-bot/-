<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>W</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E53935; --red-deep:#C62828; --red-soft:#FFEBEE; --blush:#FFF5F5;
  --white:#FFFFFF; --ink:#212121; --muted:#757575; --line:#FFCDD2;
  --bg-video: #000000;
}
/* Dark Mode Variables */
body.dark {
  --white:#121212; --ink:#F5F5F5; --blush:#1E1E1E; --line:#333333; --muted:#AAAAAA;
  --red-soft: #3E1A1A;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{
  font-family:'Figtree','Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  background:var(--blush);color:var(--ink);line-height:1.6;min-height:100dvh;
  transition: background 0.3s, color 0.3s;
}
html[lang="fa"] body{font-family:'Vazirmatn','Figtree',Tahoma,'Segoe UI',system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--red-soft);outline-offset:2px;box-shadow:0 0 0 2px var(--red)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--red);animation:breathe 6s ease-in-out infinite;flex:none}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(229,57,53,.28)}50%{transform:scale(1.18);box-shadow:0 0 0 10px rgba(229,57,53,0)}}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem}
.pill{border-radius:999px;padding:10px 20px;font-weight:600;font-size:.94rem;transition:background .25s,border-color .25s,color .25s}
.pill.solid{background:var(--red);color:#fff}
.pill.solid:hover{background:var(--red-deep)}
.pill.ghost{border:1.5px solid var(--line);color:var(--red-deep)}
.pill.ghost:hover{border-color:var(--red);background:var(--blush)}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:var(--white)}
.auth::before,.auth::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.auth::before{width:520px;height:520px;background:var(--red-soft);top:-200px;inset-inline-end:-160px}
.auth::after{width:260px;height:260px;background:var(--red);opacity:.9;bottom:-110px;inset-inline-start:-80px}
.auth .lang{position:absolute;top:18px;inset-inline-end:18px;z-index:2}
.acard{
  position:relative;z-index:1;width:min(400px,100%);background:var(--white);border:1px solid var(--line);
  border-radius:28px;padding:34px 30px 28px;
}
.acard .logo{margin-bottom:22px}
.acard h1{font-size:1.6rem;font-weight:600;line-height:1.35}
.acard .sub{color:var(--muted);margin:6px 0 22px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.88rem;font-weight:500;margin-bottom:5px}
.field input{
  width:100%;border:1.5px solid var(--line);background:var(--blush);border-radius:14px;padding:11px 15px;
  transition:border-color .25s,background .25s; color: var(--ink);
}
.field input:focus{outline:none;border-color:var(--red);background:var(--white)}
.field input.ltr{direction:ltr;text-align:start}
.err{color:var(--red-deep);font-size:.9rem;min-height:1.4em;margin:2px 0 10px}
.acard .pill.solid{width:100%;padding:13px}
.switch{text-align:center;margin-top:18px;font-size:.92rem;color:var(--muted)}
.switch button{color:var(--red-deep);font-weight:600;margin-inline-start:6px}
.switch button:hover{text-decoration:underline}

/* ---------- app shell ---------- */
.app{width:100%;max-width:460px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--white);position:relative;overflow:hidden;padding-bottom: 60px;}
@media(min-width:700px){
  body{padding:16px}
  .app{height:min(calc(100dvh - 32px),920px);border-radius:30px;border:1px solid var(--line)}
}
.top{background:var(--white);z-index:6;border-bottom:1px solid var(--line);padding:10px 14px 0;position:relative}
.trow{display:flex;align-items:center;gap:8px}
.trow .logo{margin-inline-end:auto;font-size:1.15rem}
.ib{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);
  color:var(--red-deep);transition:background .25s,border-color .25s;flex:none
}
.ib:hover{border-color:var(--red);background:var(--blush)}
.ib.solid{background:var(--red);border-color:var(--red);color:#fff}
.ib.solid:hover{background:var(--red-deep)}
.ib svg,.rb svg,.nv svg,.bn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.langbtn{border:1.5px solid var(--line);border-radius:999px;padding:0 13px;height:38px;font-weight:600;font-size:.88rem;color:var(--red-deep)}
.langbtn:hover{border-color:var(--red);background:var(--blush)}
.me{width:38px;height:38px;border-radius:50%;background:var(--red-soft);color:var(--red-deep);font-weight:700;display:grid;place-items:center;flex:none}
.menu{
  position:absolute;top:56px;inset-inline-end:14px;background:var(--white);border:1px solid var(--line);border-radius:18px;
  padding:12px 14px;z-index:30;min-width:170px;box-shadow:0 14px 40px rgba(229,57,53,.14)
}
.menu .who{font-size:.9rem;color:var(--muted);direction:ltr;text-align:start;margin-bottom:8px}
.menu button{color:var(--red-deep);font-weight:600;width:100%;text-align:start;padding:6px 0}
.srow{padding:10px 0 0}
.srow input{width:100%;border:1.5px solid var(--line);background:var(--blush);border-radius:999px;padding:9px 16px; color: var(--ink);}
.srow input:focus{outline:none;border-color:var(--red);background:var(--white)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 15px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);font-weight:500;font-size:.9rem;transition:all .25s}
.chip:hover{border-color:var(--red);color:var(--red-deep)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- bottom nav ---------- */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: var(--white);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 10;
}
.bn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 50px; height: 50px; border-radius: 12px; color: var(--muted); transition: all 0.2s;
}
.bn:hover, .bn.active { color: var(--red); }
.bn.active svg { fill: var(--red-soft); stroke: var(--red); }
.bn.solid { background: var(--red); color: #fff; border-radius: 50%; width: 44px; height: 44px; }
.bn.solid:hover { background: var(--red-deep); color: #fff; }
.bn.solid svg { stroke: #fff; }

/* ---------- reels ---------- */
.stage{flex:1;min-height:0;position:relative}
.reels{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:var(--h,100%);scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;user-select:none;-webkit-user-select:none}
.reel .bg{position:absolute;inset:0;background:var(--bg-video); display: flex; align-items: center; justify-content: center;}
/* Aspect Ratio Preserved */
.reel .bg svg,.reel .bg img,.reel .bg video{width:100%;height:100%;display:block;object-fit:contain;}
.scrim{position:absolute;inset-inline:0;bottom:0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.txt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding-block:80px;padding-inline:28px 84px;font-size:clamp(1.35rem,5.2vw,1.9rem);line-height:1.7;font-weight:600;
  overflow-wrap:anywhere;pointer-events:none
}
.meta{position:absolute;inset-inline:0;bottom:0;padding:18px 18px 24px;padding-inline-end:88px;pointer-events:none; color: #fff;}
.by{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red-deep);display:grid;place-items:center;font-weight:700;flex:none}
.by b{font-weight:600}
.tag{font-size:.82rem;opacity:.85;margin-inline-start:2px}
.cap{margin-top:10px;line-height:1.6;max-height:5.8em;overflow:hidden;overflow-wrap:anywhere}
.rail{position:absolute;inset-inline-end:12px;bottom:26px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2}
.rw{display:flex;flex-direction:column;align-items:center;gap:3px}
.rb{
  width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.93);display:grid;place-items:center;
  color:var(--red-deep);transition:transform .25s,color .25s;
}
.rb:hover{transform:scale(1.06)}
.rb svg{width:23px;height:23px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.rb.on{color:var(--red)}
.rb.on svg{fill:var(--red);stroke:var(--red);transform:scale(1.12)}
.rw small{font-size:.78rem;font-weight:600; color: #fff;}
.popheart{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;animation:pop .8s ease forwards;z-index:3}
.popheart svg{width:100%;height:100%;fill:var(--red);stroke:#fff;stroke-width:1.4;stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--muted);gap:18px}
.empty .art{width:120px;height:120px;position:relative}
.empty .art i{position:absolute;border-radius:50%}
.empty .art i:nth-child(1){inset:0;background:var(--red-soft)}
.empty .art i:nth-child(2){width:58px;height:58px;background:var(--red);inset-inline-end:2px;bottom:8px;animation:breathe 6s ease-in-out infinite}
.empty p{max-width:26ch}

.nav{position:fixed;top:50%;inset-inline-end:calc(50% - 230px - 66px);transform:translateY(-50%);display:none;flex-direction:column;gap:10px;z-index:4}
@media(min-width:700px){.nav{display:flex}}
.nv{width:44px;height:44px;border-radius:50%;background:var(--white);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--red-deep);transition:background .25s,border-color .25s}
.nv:hover{border-color:var(--red);background:var(--blush)}

/* ---------- comments sheet ---------- */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.veil.open{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;inset-inline:0;bottom:0;height:64%;background:var(--white);border-radius:26px 26px 0 0;z-index:21;
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;
  padding:16px 18px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.15)
}
.sheet.open{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-h h2{font-size:1.05rem;font-weight:600}
.sh-h .ib{width:34px;height:34px}
.clist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:6px 0 10px}
.cm{display:flex;gap:10px;font-size:.93rem}
.cm b{font-weight:600}
.none{color:var(--muted);font-size:.93rem;text-align:center;margin:auto}
.cbox{display:flex;gap:8px;padding-top:6px}
.cbox input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--blush); color: var(--ink);}
.cbox input:focus{outline:none;border-color:var(--red);background:var(--white)}

/* ---------- composer ---------- */
dialog{
  border:0;border-radius:26px;padding:0;width:min(520px,94vw);background:var(--white);color:var(--ink);margin:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.18)
}
dialog[open]{animation:dlg .35s cubic-bezier(.2,.9,.3,1)}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(6px)}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.composer{padding:26px 24px 22px;position:relative}
.composer h2{font-size:1.25rem;font-weight:600;margin-bottom:14px}
.composer .x{position:absolute;top:16px;inset-inline-end:16px;width:36px;height:36px}
.composer textarea{
  width:100%;min-height:130px;resize:vertical;border:1.5px solid var(--line);border-radius:18px;padding:13px 16px;
  background:var(--blush);line-height:1.7; color: var(--ink);
}
.composer textarea:focus{outline:none;border-color:var(--red);background:var(--white)}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.fname{font-size:.88rem;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.moods{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.moods small{color:var(--muted);margin-inline-end:4px}
.mood{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);transition:transform .2s,border-color .2s}
.mood[aria-pressed="true"]{border-color:var(--red-deep);transform:scale(1.15)}
.composer select{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--white); color: var(--ink);}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}

.toast{
  position:fixed;bottom:80px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--white);
  padding:11px 22px;border-radius:999px;font-size:.92rem;opacity:0;transform:translateY(12px);pointer-events:none;transition:all .35s;z-index:60
}
.toast.show{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reels{scroll-behavior:auto}}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<section class="auth" id="auth">
  <button class="langbtn lang" data-act="lang" id="authLang"></button>
  <div class="acard">
    <div class="logo"><span class="dot" aria-hidden="true"></span><span data-t="brand"></span></div>
    <h1 id="aTitle"></h1>
    <p class="sub" id="aSub"></p>
    <form id="authForm" novalidate>
      <label class="field" id="nameWrap"><span data-t="name"></span><input id="fName" autocomplete="name" maxlength="40"></label>
      <label class="field"><span data-t="username"></span><input id="fUser" class="ltr" autocomplete="username" autocapitalize="none" maxlength="20"></label>
      <label class="field"><span data-t="password"></span><input id="fPass" class="ltr" type="password" autocomplete="current-password" maxlength="64"></label>
      <p class="err" id="aErr" role="alert"></p>
      <button class="pill solid" type="submit" id="aBtn"></button>
    </form>
    <p class="switch"><span id="aSwitchTxt"></span><button data-act="mode" id="aSwitchBtn"></button></p>
  </div>
</section>

<!-- ============ APP ============ -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="trow">
      <div class="logo"><span class="dot" aria-hidden="true"></span><span data-t="brand"></span></div>
    </div>
    <div class="srow" id="srow" hidden><input id="q" type="search" autocomplete="off"></div>
    <nav class="chips" id="chips"></nav>
  </header>
  
  <div class="stage">
    <div class="reels" id="reels"></div>
  </div>
  
  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="bn" data-act="home" data-label="home"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg></button>
    <button class="bn" data-act="search" id="searchBtn" data-label="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.500 4.500"/></svg></button>
    <button class="bn solid" data-act="compose" data-label="share"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="bn" data-act="menu" id="meBtn" data-label="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></button>
  </nav>

  <div class="menu" id="menu" hidden>
    <div class="who" id="meName"></div>
    <button data-act="toggleDark" data-t="darkMode"></button>
    <button data-act="logout" data-t="logout"></button>
  </div>
  
  <div class="veil" id="veil" data-act="closeSheet"></div>
  <aside class="sheet" id="sheet" aria-live="polite"></aside>
</div>

<div class="nav" id="nav" hidden>
  <button class="nv" data-act="up" data-label="up"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button>
  <button class="nv" data-act="down" data-label="down"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button>
</div>

<dialog id="composeDlg">
  <div class="composer">
    <button class="ib x" data-act="closeCompose" data-label="close"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h2 data-t="cTitle"></h2>
    <textarea id="cText" dir="auto"></textarea>
    <div class="crow">
      <button class="pill ghost" data-act="pickFile" data-t="addMedia"></button>
      <span class="fname" id="fileName"></span>
      <input type="file" id="cFile" accept="image/*,video/*" hidden>
    </div>
    <div class="moods" id="moods"><small data-t="bg"></small></div>
    <div class="cfoot">
      <select id="cTopic" aria-label="Topic"></select>
      <button class="pill solid" data-act="publish" data-t="post"></button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  addMedia:'افزودن عکس یا ویدیو',bg:'پس‌زمینه',post:'ارسال',published:'منتشر شد',saved:'ذخیره شد',unsaved:'از ذخیره‌ها حذف شد',
  needText:'اول متنی بنویس یا عکس یا ویدیو اضافه کن',logout:'خروج',you:'شما'}
};
const TOPICS=['thoughts','art','places','music','food','books'];
const MOODS=[
 {bg:'#E53935',ink:'#FFFFFF',s1:'#EF5350',s2:'#C62828'},
 {bg:'#FFEBEE',ink:'#212121',s1:'#FFCDD2',s2:'#EF9A9A'},
 {bg:'#FFFFFF',ink:'#C62828',s1:'#FFEBEE',s2:'#FFCDD2'},
 {bg:'#FFCDD2',ink:'#212121',s1:'#FFEBEE',s2:'#FFFFFF'},
 {bg:'#C62828',ink:'#FFFFFF',s1:'#E53935',s2:'#B71C1C'},
 {bg:'#FFEBEE',ink:'#C62828',s1:'#FFFFFF',s2:'#EF9A9A'}
];

/* ================= state & persistence ================= */
const STORAGE_KEY = 'w_app_state_v1';
const defaultState = {
  lang:'en', mode:'signup', user:null, accounts:[], topic:'all', q:'',
  posts:[], liked:[], saved:[], openId:null, mood:0, file:null, nextId:1, darkMode:false
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) return saved;
  } catch(e) { console.error("Error loading state", e); }
  return defaultState;
}

const S = {
  ...defaultState,
  ...loadState(),
  liked: new Set(loadState().liked || []),
  saved: new Set(loadState().saved || []),
  posts: (loadState().posts || []).filter(p => !p.media) // Keep only text posts to avoid broken media URLs
};

function saveState() {
  const stateToSave = {
    lang: S.lang,
    mode: S.mode,
    user: S.user,
    accounts: S.accounts,
    posts: S.posts.filter(p => !p.media), // Don't save blob URLs
    liked: Array.from(S.liked),
    saved: Array.from(S.saved),
    nextId: S.nextId,
    darkMode: S.darkMode
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
}

const $=s=>document.querySelector(s);
const tr=k=>T[S.lang][k];
const fmt=n=>n.toLocaleString(S.lang==='fa'?'fa-IR':'en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=s=>[...String(s).trim()][0]||'?';
const IC={
 heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-8-4.700-8-10.500C4 6.500 6 4.500 8.500 4.500c1.500 0 2.800.8 3.500 2 .7-1.200 2-2 3.500-2C18 4.500 20 6.500 20 9.500 20 15.300 12 20 12 20Z"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M4 5.500h16v10.500H10l-4.500 3.500V16H4z"/></svg>',
 mark:'<svg viewBox="0 0 24 24"><path d="M6.500 3.500h11v17l-5.500-4-5.500 4z"/></svg>',
 x:'<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

/* ================= language ================= */
function applyLang(){
  const l=S.lang;
  document.documentElement.lang=l; document.documentElement.dir=l==='fa'?'rtl':'ltr';
  document.title=tr('brand');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));
  document.querySelectorAll('[data-label]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.label)));
  $('#authLang').textContent=tr('lang');
  $('#q').placeholder=tr('searchPh'); $('#cText').placeholder=tr('cPh');
  $('#cTopic').innerHTML=TOPICS.map(k=>`<option value="${k}">${tr(k)}</option>`).join('');
  renderAuth(); renderMoods();
  if(S.user){
    renderChips();
    const r=$('#reels'); const i=Math.round(r.scrollTop/(r.clientHeight||1));
    renderReels(); r.scrollTop=i*r.clientHeight;
    if(S.openId) renderSheet();
  }
}

/* ================= auth ================= */
function renderAuth(){
  const su=S.mode==='signup';
  $('#aTitle').textContent=tr(su?'signupTitle':'loginTitle');
  $('#aSub').textContent=tr(su?'signupSub':'loginSub');
  $('#aBtn').textContent=tr(su?'signup':'login');
  $('#aSwitchTxt').textContent=tr(su?'haveAcc':'noAcc');
  $('#aSwitchBtn').textContent=tr(su?'toLogin':'toSignup');
  $('#nameWrap').hidden=!su;
  $('#fPass').autocomplete=su?'new-password':'current-password';
}
$('#authForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#fName').value.trim(), user=$('#fUser').value.trim().toLowerCase(), pass=$('#fPass').value;
  const err=k=>{$('#aErr').textContent=tr(k)};
  if(S.mode==='signup'){
    if(!name) return err('errName');
    if(!/^[a-z0-9_]{3,20}$/.test(user)) return err('errUser');
    if(pass.length<6) return err('errPass');
    if(S.accounts.some(a=>a.user===user)) return err('errTaken');
    const acc={name,user,pass}; S.accounts.push(acc); enter(acc);
  }else{
    const acc=S.accounts.find(a=>a.user===user&&a.pass===pass);
    if(!acc) return err('errLogin');
    enter(acc);
  }
});
function enter(acc, skipSave = false){
  S.user=acc; $('#aErr').textContent='';
  $('#fName').value='';$('#fUser').value='';$('#fPass').value='';
  $('#auth').hidden=true; $('#app').hidden=false; $('#nav').hidden=false;
  $('#meBtn').innerHTML = `<span style="font-weight:700;">${ini(acc.name)}</span>`;
  $('#meName').textContent='@'+acc.user;
  S.topic='all'; S.q=''; $('#q').value='';
  renderChips(); setH(); renderReels();
  if (!skipSave) saveState();
}
function logout(){
  S.user=null; S.mode='login'; closeSheet(); $('#menu').hidden=true;
  $('#app').hidden=true; $('#nav').hidden=true; $('#auth').hidden=false; renderAuth();
  saveState();
}

/* ================= feed ================= */
function visible(){
  const q=S.q.trim().toLowerCase();
  return S.posts.filter(p=>(S.topic==='all'||p.topic===S.topic)&&(!q||(p.text+' '+p.author+' '+p.handle).toLowerCase().includes(q)));
}
function renderChips(){
  $('#chips').innerHTML=['all',...TOPICS].map(k=>`<button class="chip" data-act="chip" data-k="${k}" aria-pressed="${S.topic===k}">${tr(k)}</button>`).join('');
}
const inkOf=p=>p.media?'#fff':MOODS[p.mood].ink;
function railHTML(p){
  const lk=S.liked.has(p.id), sv=S.saved.has(p.id), c=inkOf(p);
  return `<div class="rail" style="color:${c}">
    <div class="rw"><button class="rb ${lk?'on':''}" data-act="like" data-id="${p.id}" aria-pressed="${lk}" aria-label="${tr('like')}">${IC.heart}</button><small>${fmt(p.likes+(lk?1:0))}</small></div>
    <div class="rw"><button class="rb" data-act="comment" data-id="${p.id}" aria-label="${tr('comment')}">${IC.chat}</button><small>${fmt(p.cm.length)}</small></div>
    <div class="rw"><button class="rb ${sv?'on':''}" data-act="save" data-id="${p.id}" aria-pressed="${sv}" aria-label="${tr('save')}">${IC.mark}</button></div>
  </div>`;
}
function reelHTML(p){
  let bg,body='',c=inkOf(p);
  if(p.media){
    bg=p.media.type==='video'
      ? `<video src="${p.media.url}" muted loop playsinline preload="metadata"></video>`
      : `<img src="${p.media.url}" alt="">`;
    bg+='<div class="scrim"></div>';
  }else{
    const m=MOODS[p.mood];
    bg=`<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="800" fill="${m.bg}"/><circle cx="80" cy="650" r="230" fill="${m.s1}"/><circle cx="340" cy="120" r="110" fill="${m.s2}" opacity=".55"/></svg>`;
    body=`<div class="txt" dir="auto" style="color:${m.ink}">${esc(p.text)}</div>`;
  }
  const cap=p.media&&p.text?`<p class="cap" dir="auto">${esc(p.text)}</p>`:'';
  return `<section class="reel" data-id="${p.id}">
    <div class="bg">${bg}</div>${body}
    <div class="meta" style="color:${c}">
      <div class="by"><span class="av">${esc(ini(p.author))}</span><div><b>${esc(p.author)}</b> <span class="tag">${tr(p.topic)}</span></div></div>${cap}
    </div>${railHTML(p)}</section>`;
}
function renderReels(){
  const list=visible(), box=$('#reels');
  box.innerHTML=list.length?list.map(reelHTML).join(''):
   `<div class="empty"><div class="art"><i></i><i></i></div><p>${tr('empty')}</p><button class="pill solid" data-act="compose">${tr('share')}</button></div>`;
  box.scrollTop=0; observe();
}
function updateRail(id){
  const p=S.posts.find(x=>x.id===id), r=document.querySelector(`.reel[data-id="${id}"] .rail`);
  if(p&&r) r.outerHTML=railHTML(p);
}
let io;
function observe(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target.querySelector('video'); if(!v) return;
    if(e.isIntersecting&&e.intersectionRatio>.6) v.play().catch(()=>{}); else v.pause();
  }),{root:$('#reels'),threshold:[0,.6,1]});
  document.querySelectorAll('.reel').forEach(r=>io.observe(r));
}
function setH(){const r=$('#reels');r.style.setProperty('--h',r.clientHeight+'px')}
window.addEventListener('resize',()=>{if(S.user)setH()});

/* tap: double-tap likes, single tap toggles video */
let lastTap=0,lastId=0,tapT;
$('#reels').addEventListener('click',e=>{
  if(e.target.closest('button')) return;
  const r=e.target.closest('.reel'); if(!r) return;
  const id=+r.dataset.id, now=Date.now();
  if(now-lastTap<300&&lastId===id){
    clearTimeout(tapT); lastTap=0;
    if(!S.liked.has(id)){S.liked.add(id);updateRail(id); saveState();}
    const h=document.createElement('div');h.className='popheart';h.innerHTML=IC.heart;r.appendChild(h);setTimeout(()=>h.remove(),850);
  }else{
    lastTap=now; lastId=id; clearTimeout(tapT);
    tapT=setTimeout(()=>{const v=r.querySelector('video'); if(v) v.paused?v.play():v.pause()},300);
  }
});

/* ================= comments ================= */
function renderSheet(){
  const p=S.posts.find(x=>x.id===S.openId); if(!p) return;
  const list=p.cm.length?p.cm.map(c=>`<div class="cm"><span class="av">${esc(ini(c.a))}</span><div><b>${esc(c.a)}</b><br><span dir="auto">${esc(c.t)}</span></div></div>`).join(''):`<p class="none">${tr('noCm')}</p>`;
  $('#sheet').innerHTML=`<div class="sh-h"><h2>${tr('comments')} (${fmt(p.cm.length)})</h2><button class="ib" data-act="closeSheet" aria-label="${tr('close')}">${IC.x}</button></div>
    <div class="clist" id="clist">${list}</div>
    <div class="cbox"><input id="cmIn" dir="auto" placeholder="${tr('addCm')}" maxlength="240"><button class="pill solid" data-act="sendCm">${tr('send')}</button></div>`;
}
function openSheet(id){S.openId=id;renderSheet();$('#sheet').classList.add('open');$('#veil').classList.add('open')}
function closeSheet(){S.openId=null;$('#sheet').classList.remove('open');$('#veil').classList.remove('open')}

/* ================= composer ================= */
function renderMoods(){
  const box=$('#moods'); box.querySelectorAll('.mood').forEach(b=>b.remove());
  MOODS.forEach((m,i)=>{
    const b=document.createElement('button');b.className='mood';b.type='button';b.dataset.act='mood';b.dataset.i=i;
    b.style.background=m.bg;b.setAttribute('aria-pressed',S.mood===i);b.setAttribute('aria-label',tr('bg')+' '+(i+1));box.appendChild(b);
  });
}
function resetComposer(){
  $('#cText').value='';$('#cFile').value='';S.file=null;$('#fileName').textContent='';$('#moods').hidden=false;S.mood=0;renderMoods();
}
$('#cFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  if(!/^(image|video)\//.test(f.type)){e.target.value='';return}
  S.file=f; $('#fileName').textContent=f.name; $('#moods').hidden=true;
});

let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function scrollReels(dir){const r=$('#reels');r.scrollBy({top:dir*r.clientHeight,behavior:'smooth'})}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(!e.target.closest('#menu,#meBtn')) $('#menu').hidden=true;
  if(e.target.id==='composeDlg'){e.target.close();return}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=+el.dataset.id;
  switch(a){
    case 'lang': S.lang=S.lang==='en'?'fa':'en'; applyLang(); saveState(); break;
    case 'mode': S.mode=S.mode==='signup'?'login':'signup'; $('#aErr').textContent=''; renderAuth(); break;
    case 'logout': logout(); break;
    case 'menu': $('#menu').hidden=!$('#menu').hidden; break;
    case 'toggleDark': 
      S.darkMode = !S.darkMode;
      document.body.classList.toggle('dark', S.darkMode);
      saveState();
      break;
    case 'home': 
      $('#reels').scrollTo({top:0, behavior:'smooth'}); 
      break;
    case 'search': {
      const s=$('#srow'); 
      s.hidden=!s.hidden; 
      if(!s.hidden) $('#q').focus(); 
      else {S.q='';$('#q').value='';renderReels()} 
      setH(); 
      break;}
    case 'chip': S.topic=el.dataset.k; renderChips(); renderReels(); break;
    case 'like': S.liked.has(id)?S.liked.delete(id):S.liked.add(id); updateRail(id); saveState(); break;
    case 'save': if(S.saved.has(id)){S.saved.delete(id);toast(tr('unsaved'))}else{S.saved.add(id);toast(tr('saved'))} updateRail(id); saveState(); break;
    case 'comment': openSheet(id); break;
    case 'closeSheet': closeSheet(); break;
    case 'sendCm': {
      const v=$('#cmIn').value.trim(); if(!v) break;
      const p=S.posts.find(x=>x.id===S.openId); p.cm.push({a:S.user.name,t:v});
      renderSheet(); updateRail(p.id); saveState(); const c=$('#clist'); c.scrollTop=c.scrollHeight; break;}
    case 'up': scrollReels(-1); break;
    case 'down': scrollReels(1); break;
    case 'compose': $('#composeDlg').showModal(); $('#cText').focus(); break;
    case 'closeCompose': $('#composeDlg').close(); break;
    case 'pickFile': $('#cFile').click(); break;
    case 'mood': S.mood=+el.dataset.i; renderMoods(); break;
    case 'publish': {
      const text=$('#cText').value.trim();
      if(!text&&!S.file){toast(tr('needText'));break}
      const post={id:S.nextId++,author:S.user.name,handle:S.user.user,topic:$('#cTopic').value,text,mood:S.mood,likes:0,cm:[],
        media:S.file?{type:S.file.type.startsWith('video')?'video':'image',url:URL.createObjectURL(S.file)}:null};
      S.posts.unshift(post); $('#composeDlg').close(); resetComposer();
      S.topic='all'; S.q=''; $('#q').value=''; renderChips(); renderReels(); toast(tr('published')); saveState(); break;}
  }
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderReels()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cmIn'){e.preventDefault();document.querySelector('[data-act="sendCm"]').click();return}
  if(e.key==='Escape'&&S.openId){closeSheet();return}
  if(!S.user||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$('#composeDlg').open) return;
  if(e.key==='ArrowDown'){e.preventDefault();scrollReels(1)}
  if(e.key==='ArrowUp'){e.preventDefault();scrollReels(-1)}
});

/* ================= init ================= */
// Apply saved theme
if (S.darkMode) document.body.classList.add('dark');

// Apply saved language
applyLang();

// Auto-login if user exists
if (S.user) {
  enter(S.user, true);
}
</script>
</body>
</html>
